[package]
name = "elliptic_curve_bsd"
version = "0.1.0"
edition = "2021"

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
nalgebra = "0.33"
approx = "0.5"
libm = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "bsd_spectral"
path = "src/main.rs"

[[bin]]
name = "audit_bsd_sha"
path = "src/bin/audit_bsd_sha.rs"

[lib]
name = "elliptic_curve_bsd"
path = "src/lib.rs"
